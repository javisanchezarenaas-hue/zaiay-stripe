services:
  - type: web
    name: zaiay-stripe
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SITE_URL
        value: https://zayai.netlify.app
      - key: API_URL
        value: https://zaiay-stripe.onrender.com
      - key: DATABASE_URL
        fromDatabase: { name: zaiay-db, property: connectionString }
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
databases:
  - name: zaiay-db
    plan: free
